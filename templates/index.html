<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoValue AI - Smart Vehicle Pricing</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        select:invalid {
            color: rgba(255, 255, 255, 0.4);
        }

        select option {
            color: #ffffff;
            background-color: #2a2a2a;
        }

        select option[disabled] {
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>
    <div class="main-wrapper">
        <div class="top-header">
            <span class="logo-icon">🚗</span>
            <h1>AutoValue AI</h1>
            <span class="subtitle">Smart Vehicle Pricing</span>
        </div>

        <div class="container">
            <div class="form-section">
                <h2>Tell us about your car</h2>
                <p>Enter the vehicle details and let our machine learning model estimate its value.</p>

                <form id="prediction-form">

                    <!-- Vehicle Brand -->
                    <div class="input-group">
                        <label>Vehicle Brand</label>
                        <select id="brand" required>
                            <option value="" disabled selected>Select Brand</option>
                            <option value="0">Honda</option>
                            <option value="1">Nissan</option>
                            <option value="2">Suzuki</option>
                            <option value="3">Toyota</option>
                        </select>
                    </div>

                    <!-- Vehicle Model -->
                    <div class="input-group">
                        <label>Vehicle Model</label>
                        <select id="model" required>
                            <option value="" disabled selected>Select Model</option>
                            <option value="0">Alto</option>
                            <option value="1">Civic</option>
                            <option value="2">Corolla</option>
                            <option value="3">Swift</option>
                            <option value="4">Vitz</option>
                        </select>
                    </div>

                    <!-- Make Year -->
                    <div class="input-group">
                        <label>Make Year</label>
                        <select id="make_year" required></select>
                    </div>

                    <!-- Engine Capacity -->
                    <div class="input-group">
                        <label>Engine Capacity (CC)</label>
                        <select id="engine_cc" required></select>
                    </div>

                    <!-- Mileage -->
                    <div class="input-group">
                        <label>Mileage (km driven)</label>
                        <input type="number" id="km_driven" list="mileage_list"
                            placeholder="Select or type (e.g. 45000)" min="0" required>
                        <datalist id="mileage_list"></datalist>
                    </div>

                    <!-- Fuel Type -->
                    <div class="input-group">
                        <label>Fuel Type</label>
                        <select id="fuel_type" required>
                            <option value="" disabled selected>Select Fuel Type</option>
                            <option value="1">Petrol</option>
                            <option value="0">Diesel</option>
                            <option value="2">CNG</option>
                        </select>
                    </div>

                    <!-- Transmission -->
                    <div class="input-group">
                        <label>Transmission</label>
                        <select id="transmission" required>
                            <option value="" disabled selected>Select Transmission</option>
                            <option value="1">Automatic</option>
                            <option value="0">Manual</option>
                        </select>
                    </div>

                    <button type="submit" class="predict-btn">Predict Vehicle Price</button>
                </form>
            </div>

            <div class="result-section">
                <h3>AI MARKET ESTIMATE</h3>
                <p>Estimated Value</p>
                <h1 id="estimated-price">Rs. 0.00</h1>
            </div>
        </div>
    </div>

    <script>
        // Make Year
        const yearDropdown = document.getElementById('make_year');
        yearDropdown.innerHTML = '<option value="" disabled selected>Select Make Year</option>';
        for (let year = 2025; year >= 1990; year--) {
            let option = document.createElement('option');
            option.value = year; option.text = year;
            yearDropdown.appendChild(option);
        }

        // Engine CC
        const ccDropdown = document.getElementById('engine_cc');
        ccDropdown.innerHTML = '<option value="" disabled selected>Select Engine Capacity</option>';
        for (let cc = 800; cc <= 3000; cc += 50) {
            let option = document.createElement('option');
            option.value = cc; option.text = cc + " CC";
            ccDropdown.appendChild(option);
        }

        // Mileage
        const mileageDatalist = document.getElementById('mileage_list');
        for (let i = 0; i <= 300000; i += 500) {
            let option = document.createElement('option');
            option.value = i;
            mileageDatalist.appendChild(option);
        }

        document.getElementById('prediction-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const data = {
                "brand": parseInt(document.getElementById('brand').value),
                "model": parseInt(document.getElementById('model').value),
                "make_year": parseInt(document.getElementById('make_year').value),
                "engine_capacity(CC)": parseFloat(document.getElementById('engine_cc').value),
                "km_driven": parseFloat(document.getElementById('km_driven').value),
                "fuel_type": parseInt(document.getElementById('fuel_type').value),
                "transmission": parseInt(document.getElementById('transmission').value),
                "ownership": 0,
                "has_insurance": 1,
                "spare_key": 1
            };

            fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data),
            })
                .then(response => response.json())
                .then(data => {
                    if (data.estimated_price) {
                        document.getElementById('estimated-price').innerText = 'Rs. ' + data.estimated_price.toLocaleString();
                    } else {
                        alert('Error: ' + data.error);
                    }
                })
                .catch((error) => console.error('Error:', error));
        });
    </script>
</body>

</html>
